<section class="view" id="view-models">
    <div class="page-header">
        <div class="page-title">
            <div class="icon-box" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h2>إدارة النماذج الذكية</h2>
                <small>مقارنة أداء نماذج الكشف عن الشذوذ</small>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <div class="chart-card">
                <h5><i class="fa-solid fa-table"></i> تقييم آخر قراءة مستلمة</h5>
                <div class="d-flex justify-content-center my-3">
                    <select id="modelSensorSelect" class="form-select" style="max-width:220px;" onchange="loadModelsComparison()">
                        <option value="temperature">🌡️ آخر قراءة حرارة</option>
                        <option value="humidity">💧 آخر قراءة رطوبة</option>
                    </select>
                </div>
                <div id="modelsTable" class="mt-3 text-center text-muted">في انتظار البيانات...</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h5><i class="fa-solid fa-chart-column" style="color:#8b5cf6;"></i> مخطط درجات السلوك غير الاعتيادي (Anomaly Scores)</h5>
                <div class="chart-container"><canvas id="modelsRadarChart"></canvas></div>
            </div>
        </div>
    </div>
</section>
