<section class="view" id="view-thresholds">
    <div class="page-header">
        <div class="page-title">
            <div class="icon-box"><i class="fa-solid fa-sliders"></i></div>
            <div>
                <h2>إدارة العتبات</h2>
                <small>تحديد الحدود المسموحة</small>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="threshold-card" style="border-top: 3px solid var(--accent-orange);">
                <h5 style="color:#ff8c42;"><i class="fa-solid fa-temperature-three-quarters"></i> عتبة الحرارة</h5>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <div style="background:rgba(255,140,66,0.1); padding:10px; border-radius:10px; text-align:center;">
                            <small style="color:var(--text-muted);">الحد الأدنى</small>
                            <div style="font-size:1.5rem; font-weight:900; color:#ff8c42;" id="tempThreshMin">--</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div style="background:rgba(239,68,68,0.1); padding:10px; border-radius:10px; text-align:center;">
                            <small style="color:var(--text-muted);">الحد الأعلى</small>
                            <div style="font-size:1.5rem; font-weight:900; color:#fca5a5;" id="tempThreshMax">--</div>
                        </div>
                    </div>
                </div>
                <form onsubmit="updateThreshold(event, 'temperature')">
                    <div class="row g-2">
                        <div class="col-6"><input type="number" step="0.1" class="form-control-custom" id="tempNewMin" required></div>
                        <div class="col-6"><input type="number" step="0.1" class="form-control-custom" id="tempNewMax" required></div>
                    </div>
                    <button type="submit" class="btn btn-primary-custom mt-3 w-100">
                        <i class="fa-solid fa-save"></i> حفظ
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="threshold-card" style="border-top: 3px solid var(--accent-cyan);">
                <h5 style="color:var(--accent-cyan);"><i class="fa-solid fa-droplet"></i> عتبة الرطوبة</h5>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <div style="background:rgba(0,212,255,0.1); padding:10px; border-radius:10px; text-align:center;">
                            <small style="color:var(--text-muted);">الحد الأدنى</small>
                            <div style="font-size:1.5rem; font-weight:900; color:var(--accent-cyan);" id="humThreshMin">--</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div style="background:rgba(59,130,246,0.1); padding:10px; border-radius:10px; text-align:center;">
                            <small style="color:var(--text-muted);">الحد الأعلى</small>
                            <div style="font-size:1.5rem; font-weight:900; color:#3b82f6;" id="humThreshMax">--</div>
                        </div>
                    </div>
                </div>
                <form onsubmit="updateThreshold(event, 'humidity')">
                    <div class="row g-2">
                        <div class="col-6"><input type="number" step="0.1" class="form-control-custom" id="humNewMin" required></div>
                        <div class="col-6"><input type="number" step="0.1" class="form-control-custom" id="humNewMax" required></div>
                    </div>
                    <button type="submit" class="btn btn-primary-custom mt-3 w-100">
                        <i class="fa-solid fa-save"></i> حفظ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="table-card mt-3">
        <h5 style="color:var(--accent-cyan);"><i class="fa-solid fa-envelope"></i> إعدادات الإيميل</h5>
        <form onsubmit="updateEmail(event)" class="mt-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-8">
                    <input type="email" class="form-control-custom" id="alertEmailInput" placeholder="example@gmail.com">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="fa-solid fa-paper-plane"></i> حفظ
                    </button>
                </div>
            </div>
        </form>
    </div>
</section>
