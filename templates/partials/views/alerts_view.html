<section class="view" id="view-alerts">
    <div class="page-header">
        <div class="page-title">
            <div class="icon-box" style="background:linear-gradient(135deg,#ff8c42,#ef4444);">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div>
                <h2>سجل التنبيهات</h2>
                <small>جميع التنبيهات</small>
            </div>
        </div>
        <small style="color:var(--text-muted);"><span class="pulse-dot"></span> تحديث تلقائي</small>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon" style="background:rgba(255,140,66,0.15); color:#ff8c42;"><i class="fa-solid fa-bell"></i></div>
                <div class="value" id="alertTotal">0</div>
                <div class="label">الإجمالي</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon" style="background:rgba(16,185,129,0.15); color:#34d399;"><i class="fa-solid fa-circle-check"></i></div>
                <div class="value" id="alertSent">0</div>
                <div class="label">المرسلة</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="icon" style="background:rgba(239,68,68,0.15); color:#fca5a5;"><i class="fa-solid fa-circle-xmark"></i></div>
                <div class="value" id="alertFailed">0</div>
                <div class="label">الفاشلة</div>
            </div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr><th>#</th><th>الرسالة</th><th>الوقت</th><th>الإيميل</th><th>إجراء</th></tr>
                </thead>
                <tbody id="alertsTableBody"></tbody>
            </table>
        </div>
        <div id="alertsPagination" class="pagination"></div>
    </div>
</section>
