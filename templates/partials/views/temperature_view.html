<section class="view" id="view-temperature">
    <div class="page-header">
        <div class="page-title">
            <div class="icon-box" style="background:linear-gradient(135deg,#ff8c42,#ef4444);">
                <i class="fa-solid fa-temperature-three-quarters"></i>
            </div>
            <div>
                <h2>صفحة الحرارة</h2>
                <small>مراقبة درجات الحرارة</small>
            </div>
        </div>
        <button class="btn btn-danger-custom" onclick="clearSensorDataByType('temperature')">
            <i class="fa-solid fa-trash"></i> حذف بيانات الحرارة
        </button>
    </div>

    <div class="big-number-card temp">
        <div class="label"><i class="fa-solid fa-thermometer-half"></i> درجة الحرارة الحالية</div>
        <div class="number" id="tempValue">--</div><span class="unit">°C</span>
        <div class="timestamp" id="tempTime">آخر تحديث: --</div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3 col-sm-6">
            <div class="stat-card">
                <div class="icon" style="background:rgba(16,185,129,0.15); color:#34d399;"><i class="fa-solid fa-arrow-down"></i></div>
                <div class="value" id="tempMin">--</div>
                <div class="label">أقل قيمة</div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card">
                <div class="icon" style="background:rgba(239,68,68,0.15); color:#fca5a5;"><i class="fa-solid fa-arrow-up"></i></div>
                <div class="value" id="tempMax">--</div>
                <div class="label">أعلى قيمة</div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card">
                <div class="icon" style="background:rgba(59,130,246,0.15); color:#3b82f6;"><i class="fa-solid fa-calculator"></i></div>
                <div class="value" id="tempAvg">--</div>
                <div class="label">المتوسط</div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card">
                <div class="icon" style="background:rgba(0,212,255,0.15); color:var(--accent-cyan);"><i class="fa-solid fa-list-ol"></i></div>
                <div class="value" id="tempCount">--</div>
                <div class="label">عدد القراءات</div>
            </div>
        </div>
    </div>

    <div class="chart-card">
        <h5><i class="fa-solid fa-chart-line" style="color:#ff8c42;"></i> مخطط تغير درجة الحرارة</h5>
        <div class="chart-container"><canvas id="tempChart"></canvas></div>
        <div class="mt-3 d-flex gap-2 align-items-center justify-content-end flex-wrap">
            <label class="form-label-custom" style="margin:0;">الجهاز:</label>
            <select id="tempDeviceFilter" class="form-control-custom" style="width:auto; padding:5px; min-width:160px;" onchange="loadSensorData('temperature')"></select>
            <label class="form-label-custom" style="margin:0;">عرض سجلات يوم:</label>
            <select id="tempDayFilter" class="form-control-custom" style="width:auto; padding:5px; min-width:140px;" onchange="loadSensorData('temperature')"></select>
        </div>
    </div>

    <div class="table-card">
        <h5 style="color:var(--accent-cyan);"><i class="fa-solid fa-sliders"></i> حالة العتبة</h5>
        <div id="tempThresholdStatus" class="mt-3"></div>
    </div>
</section>
