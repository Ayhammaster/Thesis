<!-- نافذة إضافة جهاز -->
<div class="modal-overlay" id="deviceModal">
    <div class="modal-box">
        <h5><i class="fa-solid fa-plus-circle"></i> إضافة جهاز جديد</h5>
        <form onsubmit="addDevice(event)">
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="newDeviceCode" placeholder="كود الجهاز" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="newDeviceName" placeholder="اسم الجهاز" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="newEncryptionKey" placeholder="مفتاح الأمان">
            </div>
            <div class="mb-3">
                <select class="form-control-custom" id="newProtocol">
                    <option value="HTTP">HTTP</option>
                    <option value="MQTT">MQTT</option>
           
                </select>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-danger-custom w-50" onclick="closeModal('deviceModal')">إلغاء</button>
                <button type="submit" class="btn btn-primary-custom w-50">
                    <i class="fa-solid fa-save"></i> حفظ
                </button>
            </div>
        </form>
    </div>
</div>

<!-- نافذة تعديل جهاز -->
<div class="modal-overlay" id="editDeviceModal">
    <div class="modal-box">
        <h5><i class="fa-solid fa-edit"></i> تعديل جهاز</h5>
        <form onsubmit="updateDevice(event)">
            <input type="hidden" id="editDeviceId">
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="editDeviceCode" placeholder="كود الجهاز" disabled>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="editDeviceName" placeholder="اسم الجهاز" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control-custom" id="editEncryptionKey" placeholder="مفتاح الأمان">
            </div>
            <div class="mb-3">
                <select class="form-control-custom" id="editProtocol">
                    <option value="HTTP">HTTP</option>
                    <option value="MQTT">MQTT</option>
               
                </select>
            </div>
            <div class="mb-3">
                <input type="number" class="form-control-custom" id="editInterval" placeholder="فترة الإرسال (ثانية)">
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-danger-custom w-50" onclick="closeModal('editDeviceModal')">إلغاء</button>
                <button type="submit" class="btn btn-primary-custom w-50">
                    <i class="fa-solid fa-save"></i> تحديث
                </button>
            </div>
        </form>
    </div>
</div>

<!-- نافذة عرض جهاز -->
<div class="modal-overlay" id="viewDeviceModal">
    <div class="modal-box">
        <h5><i class="fa-solid fa-eye"></i> تفاصيل الجهاز</h5>
        <div id="deviceDetails">
            <div class="detail-row">
                <span class="detail-label">كود الجهاز:</span>
                <span class="detail-value" id="viewDeviceCode">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">الاسم:</span>
                <span class="detail-value" id="viewDeviceName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">الحالة:</span>
                <span class="detail-value" id="viewDeviceStatus">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">مفتاح الأمان:</span>
                <span class="detail-value" id="viewEncryptionKey">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">البروتوكول:</span>
                <span class="detail-value" id="viewProtocol">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">فترة الإرسال:</span>
                <span class="detail-value" id="viewInterval">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">آخر ظهور:</span>
                <span class="detail-value" id="viewLastSeen">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">UUID:</span>
                <span class="detail-value" id="viewUuid">-</span>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn btn-primary-custom w-100" onclick="closeModal('viewDeviceModal')">إغلاق</button>
        </div>
    </div>
</div>
